[project]
name = "trendscout-supplier-connector"
version = "1.0.0"
description = "Super AI-Agent that connects global trends with Indonesian suppliers"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.5.3",
    "pydantic-settings>=2.1.0",
    "python-dotenv>=1.0.0",
    "firecrawl-py>=0.0.16",
    "httpx>=0.26.0",
    "aiohttp>=3.9.1",
    "requests>=2.31.0",
    "python-multipart>=0.0.6",
    "openai>=1.10.0",
    "anthropic>=0.8.1",
    "pandas>=2.1.4",
    "pytrends>=4.9.2",
    "beautifulsoup4>=4.12.3",
    "lxml>=5.1.0",
    "sqlalchemy>=2.0.25",
    "alembic>=1.13.1",
    "redis>=5.0.1",
    "celery>=5.3.6",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "Jinja2>=3.1.3",
    "aiosmtplib>=3.0.1",
    "twilio>=8.12.0",
    "pillow>=10.2.0",
    "numpy>=1.26.3",
    "tenacity>=8.2.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.3",
    "pytest-asyncio>=0.21.1",
    "pytest-cov>=4.1.0",
    "black>=23.12.1",
    "ruff>=0.1.9",
    "mypy>=1.8.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.black]
line-length = 100
target-version = ['py39']

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
